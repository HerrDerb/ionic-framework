<ion-header>
  <ion-toolbar>
    <ion-title>Menu swipe race</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <p>
    Tap the button, then put a finger on the right edge of the screen and hold it. When the menu starts to
    open, drag the finger to the left.
  </p>
  <ion-button id="open-later" (click)="openLater()">Open menu in 2 s</ion-button>
</ion-content>
