<ion-app>
  <ion-menu side="end" menuId="settings" contentId="main-content">
    <ion-header>
      <ion-toolbar>
        <ion-title>Menu</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <p>Tap the button, then put a finger on the screen and drag it sideways while the menu closes.</p>
      <ion-button id="close-later" (click)="closeLater()">Close menu in 2 s</ion-button>
    </ion-content>
  </ion-menu>
  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
